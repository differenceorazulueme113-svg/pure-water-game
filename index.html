<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Water Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .water-bag { width: 200px; height: 200px; margin: 50px auto; background: #38bdf8; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 80px; cursor: pointer; user-select: none; transition: transform 0.1s; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.5); }
        .water-bag:active { transform: scale(0.95); }
        .btn-ad { background: #22c55e; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Pure Water Tycoon 💧</h1>
    <h2>Bags Sealed: <span id="coin-count">0</span></h2>
    <div class="water-bag" id="tap-target">🛍️</div>
    <button class="btn-ad" id="ad-btn">Watch Ad for 500x Boost! 🚀</button>
    <script <hr style="border: 1px solid #2c3e50; margin: 20px 0;">
<div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; margin: 0 auto;">
    <button id="upgrade-tap-btn" style="background-color: #3498db; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px;">
        Buy Manual Sealer (+1/tap) 🛠️ <br> Cost: <span id="tap-cost">100</span> Bags
    </button>
    <button id="upgrade-auto-btn" style="background-color: #9b59b6; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px;">
        Buy Auto-Sealer (+1/sec) 🏭 <br> Cost: <span id="auto-cost">500</span> Bags
    </button>
</div>
<script src="script.js"></script>
</body>
</html>
